name: Build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: 发布 GHCR 镜像（默认不发布）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-icr.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: python -m pip install -r requirements-icr.txt httpx==0.28.1
      - run: python -m unittest test_desktop_app test_icr_api test_local_recognition -v
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
  windows:
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Configure build scratch directory
        shell: pwsh
        run: '"TMPDIR=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-build.lock.txt
      - run: python -m pip install -r windows-build.lock.txt
      - run: python build_windows.py
      - name: Exercise frozen models and tray HTTP lifecycle
        run: python tools/windows_smoke.py
      - name: Package Windows distribution
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,ICR_LICENSE.txt dist/
          Copy-Item client/*.user.js dist/
          Compress-Archive -Path dist/icr-server.exe,dist/README.md,dist/LICENSE,dist/ICR_LICENSE.txt,dist/*.user.js -DestinationPath dist/icr-server-windows-x64.zip
          (Get-FileHash dist/icr-server-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + '  icr-server-windows-x64.zip' | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icr-server-windows-x64
          path: |
            dist/icr-server-windows-x64.zip
            dist/SHA256SUMS.txt
            reports/ci-exe-self-test.json
          if-no-files-found: error
          retention-days: 14
  container:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for runtime verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: icr-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run non-root read-only image and exercise actual models
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name icr-ci --read-only --tmpfs /tmp:size=128m --cap-drop ALL --security-opt no-new-privileges:true -e ICR_TOKEN=ci-smoke-only icr-server:ci
          trap 'docker logs icr-ci; docker rm -f icr-ci' EXIT
          docker exec -i icr-ci python - < tools/container_smoke.py
      - name: Determine package names
        id: names
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then echo "$image:latest" >> "$GITHUB_OUTPUT"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; echo "$image:latest" >> "$GITHUB_OUTPUT"; fi
          echo EOF >> "$GITHUB_OUTPUT"
      # 镜像只在手动触发并勾选 publish_image 时发布；main 推送和版本标签只构建、验证镜像
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image to GitHub Packages
        if: github.event_name == 'workflow_dispatch' && inputs.publish_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
  release:
    # 只在推送版本标签时创建 Release；在标签上手动运行（发布镜像）不重复创建
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read   # 下载同一次运行的 Windows 构建产物需要
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -n icr-server-windows-x64 -D release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        # 发布说明开头取自 .github/release-credits.md，后接自动生成的变更列表
        run: gh release create "$GITHUB_REF_NAME" release/dist/*.zip release/dist/SHA256SUMS.txt client/icr-helper.user.js --verify-tag --title "$GITHUB_REF_NAME" --notes-file .github/release-credits.md --generate-notes
